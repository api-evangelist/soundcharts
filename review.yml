sources:
  - url: https://developers.soundcharts.com/api/v2/doc
    type: APIReference
    note: Lists REST base URL https://customer.api.soundcharts.com; all endpoints are HTTPS GET/POST. No WebSocket mentioned.
  - url: https://developers.soundcharts.com/api/getting-started
    type: Documentation
    note: Documents x-app-id / x-api-key headers (legacy) and Authorization access tokens; no streaming protocol described.
  - url: https://help.soundcharts.com/en/articles/10104294-what-are-the-api-subscription-levels
    type: Documentation
