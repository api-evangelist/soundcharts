aid: soundcharts
name: Soundcharts
review:
  question: Does Soundcharts expose a documented public WebSocket API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. Soundcharts exposes only a synchronous
    REST (HTTPS) API. No documented WebSocket or HTTP Server-Sent Events (SSE)
    streaming surface was found. Real-time delivery for high-volume customers
    is offered as an out-of-band incremental data feed / data dump to remote
    storage, which is a batch/file delivery mechanism rather than an in-band
    streaming API protocol, so it is not modeled as AsyncAPI.
findings:
  summary: |
    Soundcharts does not publish a documented public WebSocket API. The
    Soundcharts platform exposes a REST (HTTPS) API under
    https://customer.api.soundcharts.com, authenticated with x-app-id and
    x-api-key headers (with newer Authorization access tokens also supported).
    All documented endpoints are request/response GET or POST calls. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint
    is documented. Continuous data delivery for enterprise customers is offered
    as a separately negotiated data feed or data dump to remote storage, not as
    an in-band streaming API.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://customer.api.soundcharts.com
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the Soundcharts API reference.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming surface is documented.
