actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or SSE protocol surface exists in the documented Soundcharts
    API. The API is REST-only, so no AsyncAPI document was authored. The
    apis.yml catalog reflects the seven REST API products with OpenAPI,
    Postman, and Open Collection artifacts.
