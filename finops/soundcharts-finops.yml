specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Soundcharts
providerId: soundcharts
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Music
- Analytics
- Market Intelligence
- Metadata
- Streaming
- Charts
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Soundcharts API spend. Soundcharts bills self-served API
  subscriptions as fixed monthly fees that bundle an included monthly request
  quota tied to the tier, with higher tiers unlocking larger request volumes
  and custom enterprise data feed and data dump options sold direct. The
  primary cost driver is request volume against the included monthly quota.
  Dollar amounts are sales-led and not reconciled.
notes: >-
  Pricing is direct-sales and commitment-free monthly; per-tier prices and
  quotas should be verified against a current Soundcharts quote during
  reconciliation.
sources:
- https://developers.soundcharts.com/pricing
- https://help.soundcharts.com/en/articles/10104294-what-are-the-api-subscription-levels
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Soundcharts
serviceCategory: Analytics
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Soundcharts API
  ServiceCategory: Analytics
  ProviderName: Soundcharts
  PublisherName: Soundcharts
  InvoiceIssuerName: Soundcharts
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: api_requests
  description: API requests counted against the included monthly quota for the subscription tier.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
  - endpoint
- name: monthly_subscription
  description: Recurring monthly subscription fee for the selected API tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: data_feed
  description: Enterprise incremental live data feed delivery (custom, sold direct).
  unit: feeds
  aggregation: sum
  dimensions:
  - account
- name: data_dump
  description: Enterprise data dump to remote storage in a custom format (sold direct).
  unit: dumps
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track API request volume against the plan's monthly quota; monitor usage via the developer account.
- name: Allocation
  description: Tag credentials per workload/team and map request volume to internal cost centers.
- name: Optimization
  description: Cache stable metadata, batch lookups, and right-size the subscription tier to actual monthly request volume; consider a data feed/dump for bulk needs instead of high per-request volume.
- name: Accountability
  description: Assign an owner per subscription; review monthly request burn against the included quota before upgrading tiers.
maintainers:
- FN: Kin Lane
