    type: OpenAPI
  - url: collections/soundcharts.postman_collection.json
    type: PostmanCollection
  - url: collections/soundcharts.opencollection.json
    type: OpenCollection
  description: Resolve and retrieve standardized artist metadata (name, country, genres,
    ISNI/IPI, cross-platform identifiers), related artists, current stats, and the
    Soundcharts score by UUID or platform identifier.
