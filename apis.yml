aid: soundcharts
url: https://raw.githubusercontent.com/api-evangelist/soundcharts/refs/heads/main/apis.yml
name: Soundcharts
kind: company
description: Soundcharts is a global music-market intelligence platform that aggregates
  standardized metadata and real-time performance data for artists, songs, albums,
  and playlists across streaming, social, chart, and radio sources. The Soundcharts
  API exposes this catalog and analytics layer over a REST interface at
  https://customer.api.soundcharts.com, authenticated with x-app-id and x-api-key
  headers.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Music
- Analytics
- Market Intelligence
- Metadata
- Streaming
- Charts
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
